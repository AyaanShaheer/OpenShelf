apiVersion: v1
kind: Namespace
metadata:
  name: openshelf
  labels:
    app.kubernetes.io/part-of: openshelf
    environment: demo

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: openshelf-resource-quota
  namespace: openshelf
spec:
  hard:
    pods: "20"
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    persistentvolumeclaims: "5"
    requests.storage: 30Gi

---
apiVersion: v1
kind: LimitRange
metadata:
  name: openshelf-container-limits
  namespace: openshelf
spec:
  limits:
    - type: Container
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi