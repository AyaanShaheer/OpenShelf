apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openshelf-solr-data
  namespace: openshelf
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openshelf-local-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openshelf-solr-headless
  namespace: openshelf
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: solr
  ports:
    - name: solr
      port: 8983
      targetPort: 8983
---
apiVersion: v1
kind: Service
metadata:
  name: openshelf-solr
  namespace: openshelf
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: solr
  ports:
    - name: solr
      port: 8983
      targetPort: 8983
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openshelf-solr
  namespace: openshelf
spec:
  serviceName: openshelf-solr-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: solr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solr
        app.kubernetes.io/part-of: openshelf
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 8983
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-solr-data
          image: solr:9.7.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - |
              mkdir -p /var/solr/data
              chown -R 8983:8983 /var/solr
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: solr-data
              mountPath: /var/solr
      containers:
        - name: solr
          image: solr:9.7.0
          imagePullPolicy: IfNotPresent
          command:
            - solr-precreate
            - openshelf
            - /opt/solr/server/solr/configsets/openshelf
          ports:
            - name: solr
              containerPort: 8983
          env:
            - name: SOLR_HEAP
              value: "1g"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /solr/admin/info/system
              port: 8983
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /solr/admin/info/system
              port: 8983
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /solr/admin/info/system
              port: 8983
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: solr-data
              mountPath: /var/solr
            - name: solr-config
              mountPath: /opt/solr/server/solr/configsets/openshelf/conf
              readOnly: true
      volumes:
        - name: solr-data
          persistentVolumeClaim:
            claimName: openshelf-solr-data
        - name: solr-config
          configMap:
            name: openshelf-solr-config
