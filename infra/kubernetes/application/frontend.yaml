apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshelf-frontend
  namespace: openshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshelf-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshelf-frontend
        app.kubernetes.io/part-of: openshelf
    spec:
      containers:
        - name: frontend
          image: openshelf-frontend:0.1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              hostPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: openshelf-frontend
  namespace: openshelf
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openshelf-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
