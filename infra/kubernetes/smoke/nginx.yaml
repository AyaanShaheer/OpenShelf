apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshelf-smoke-nginx
  namespace: openshelf
  labels:
    app.kubernetes.io/name: openshelf-smoke-nginx
    app.kubernetes.io/part-of: openshelf

spec:
  replicas: 2

  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: openshelf-smoke-nginx

  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshelf-smoke-nginx

    spec:
      terminationGracePeriodSeconds: 20

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx
          image: nginx:1.31.9-alpine3.24-slim
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx
            - name: nginx-run
              mountPath: /tmp

      volumes:
        - name: nginx-logs
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: openshelf-smoke-nginx
  namespace: openshelf

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: openshelf-smoke-nginx

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP