---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_major_version'] == "24"
    fail_msg: "Docker role supports Ubuntu 24.04."

- name: Remove conflicting Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - docker-buildx
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download official Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Determine Debian package architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: docker_architecture
  changed_when: false

- name: Configure official Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris: https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - "{{ docker_architecture.stdout }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    install_python_debian: true

- name: Refresh APT package cache
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker Engine and supporting components
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Check Docker version
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version
  changed_when: false

- name: Display Docker version
  ansible.builtin.debug:
    var: docker_version.stdout

- name: Verify Docker Compose
  ansible.builtin.command:
    cmd: docker compose version
  register: docker_compose_version
  changed_when: false

- name: Display Docker Compose version
  ansible.builtin.debug:
    var: docker_compose_version.stdout

- name: Execute Docker hello-world verification
  ansible.builtin.command:
    cmd: docker run --rm hello-world
  register: docker_hello_world
  changed_when: false

- name: Display Docker verification output
  ansible.builtin.debug:
    var: docker_hello_world.stdout_lines

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "live-restore": true,
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    validate: "dockerd --validate --config-file %s"
  notify: Restart Docker
