services:
  postgres:
    image: postgres:16-bookworm
    container_name: openshelf-postgres
    restart: unless-stopped

    env_file:
      - /etc/openshelf/secrets/postgres.env

    volumes:
      - openshelf-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - openshelf

    security_opt:
      - no-new-privileges:true

volumes:
  openshelf-postgres-data:
    name: openshelf-postgres-data

networks:
  openshelf:
    name: openshelf-net
    driver: bridge